name: coffee_shop
description: >
  Coffee Shop — Sample App do Design System. Flutter + MVVM com cenas
  (Factory / ViewModel / View / Coordinator / Server) e API mockada.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: packages/design_system
  core:
    path: packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
